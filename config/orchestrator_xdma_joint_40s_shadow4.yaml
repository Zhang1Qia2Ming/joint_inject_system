data_dir: /dev/shm/joint_radar_data

network:
  interface: enp3s0f0
  destination_ip: 192.168.1.4

mode:
  video_backend: xdma
  strict: true

playback:
  allow_partial_start: false
  start_delay_ms: 5000
  max_lateness_us: 100000
  loop_count: 1
  # 0: 播共同窗口的完整段（约 40 秒），不提前按墙钟截断
  play_duration_ms: 0
  # 不把视频窗口拷进 /dev/shm。解码文件留在 SSD。
  # 6.5 秒大约 5.4 GiB，倒计时加预热刚好能在开播前读完。
  # 开播后盘还是略慢于三路同时要的速度，这段余量用来撑完整段。
  video_prefetch_ms: 6500
  sequence_mode: continuous
  # true: 倒计时结束并回车后，再用 start_delay_ms 预热队列，然后发送
  # false: 倒计时结束立即发送
  wait_for_enter: true

timing:
  video_max_lateness_us: 5000
  # 40s path reads UYVY from the SSD cache and keeps a 6.5s RAM window.
  # Video gate stays 5ms. Lidar gate stays 100ms. Point clouds remain in
  # /dev/shm/joint_radar_data.
  lidar_max_lateness_us: 100000

clock:
  require_synchronized: true

ptc:
  enabled: true
  port: 9347

report:
  output_dir: /home/ubuntu/zhang/joint_sensor_player/reports

video:
  mcap: /data/20261021-100062-101724/20261021-100062-101724/1_00062_20261021-101724-D/1_00062_20261021-101724-D_0.mcap
  cache_dir: /var/tmp/joint_sensor_player/cache
  queue_frames: 5
  lanes:
    - name: tx1
      topic: /sensor/camera_forward_far/orig/h265
      h2c: 0
      source_fps: 10
      output_fps: 30
    - name: tx2
      topic: /sensor/camera_forward_wide/orig/h265
      h2c: 1
      source_fps: 30
      output_fps: 30
    - name: tx4
      topic: /sensor/camera_backward/orig/h265
      h2c: 2
      source_fps: 10
      output_fps: 30

lidars:
  - slot: 31
    correction_file: /home/ubuntu/zhang/joint_sensor_player/calibration/1_00062/correction_file/lidar_primary_front_correction.dat
  - slot: 32
    correction_file: /home/ubuntu/zhang/joint_sensor_player/calibration/1_00062/correction_file/lidar_primary_left_correction.dat
  - slot: 33
    correction_file: /home/ubuntu/zhang/joint_sensor_player/calibration/1_00062/correction_file/lidar_primary_right_correction.dat
  - slot: 34
    correction_file: /home/ubuntu/zhang/joint_sensor_player/calibration/1_00062/correction_file/lidar_primary_rear_correction.dat
  - slot: 35
    correction_file: /home/ubuntu/zhang/joint_sensor_player/calibration/1_00062/correction_file/lidar_short_front_correction.dat
  - slot: 36
    correction_file: /home/ubuntu/zhang/joint_sensor_player/calibration/1_00062/correction_file/lidar_short_left_correction.dat
  - slot: 37
    correction_file: /home/ubuntu/zhang/joint_sensor_player/calibration/1_00062/correction_file/lidar_short_right_correction.dat
  - slot: 38
    correction_file: /home/ubuntu/zhang/joint_sensor_player/calibration/1_00062/correction_file/lidar_short_rear_correction.dat

# Sensor4-7 are read and scheduled on the host, then dropped before H2C.
shadow_video:
  manifest: /var/tmp/joint_sensor_player/cache/shadow_pano_s4s7/manifest.json
